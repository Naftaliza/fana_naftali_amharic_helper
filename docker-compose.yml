services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass123"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_strong_Pass123\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=AmharicHelper;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=True;Encrypt=False"
      Jwt__Secret: "CHANGE_ME_super_secret_key_at_least_32_chars_long_12345"
      Ai__Provider: "Claude"
      Ai__AnthropicApiKey: "${ANTHROPIC_API_KEY:-}"
      Ocr__Provider: "Claude"
      Tts__Provider: "${TTS_PROVIDER:-Azure}"
      Tts__AzureSpeechKey: "${AZURE_SPEECH_KEY:-}"
      Tts__AzureRegion: "${AZURE_SPEECH_REGION:-eastus}"
      Tts__ElevenLabsApiKey: "${ELEVENLABS_API_KEY:-}"
      Frontend__Origin: "http://localhost:3001"
    ports:
      - "5080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5080"
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  mssql-data:
