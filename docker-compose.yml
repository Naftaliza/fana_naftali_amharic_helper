services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: AmharicHelper
      POSTGRES_USER: fana
      POSTGRES_PASSWORD: fana_local_pass
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fana -d AmharicHelper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=AmharicHelper;Username=fana;Password=fana_local_pass"
      Jwt__Secret: "CHANGE_ME_super_secret_key_at_least_32_chars_long_12345"
      Ai__Provider: "Claude"
      Ai__AnthropicApiKey: "${ANTHROPIC_API_KEY:-}"
      Ocr__Provider: "Claude"
      Tts__Provider: "${TTS_PROVIDER:-Azure}"
      Tts__AzureSpeechKey: "${AZURE_SPEECH_KEY:-}"
      Tts__AzureRegion: "${AZURE_SPEECH_REGION:-eastus}"
      Tts__ElevenLabsApiKey: "${ELEVENLABS_API_KEY:-}"
      # Comma-separated emails that get admin access (provider review page).
      # Must match the email of a registered Fana account.
      Admin__Emails: "${ADMIN_EMAILS:-}"
      Frontend__Origin: "http://localhost:3001"
      Email__Smtp__Host: "smtp.sendgrid.net"
      Email__Smtp__Port: "587"
      Email__Smtp__Username: "apikey"
      Email__Smtp__Password: "${SENDGRID_API_KEY:-}"
      Email__Smtp__From: "${SENDGRID_FROM_EMAIL:-}"
      # Named volume below (not the container's own filesystem) so uploaded page images survive
      # `docker compose down`/rebuilds locally, the same way pg-data already does for Postgres.
      # See DEPLOY.md "Uploaded files" for the equivalent Railway Volume in production.
      Storage__RootPath: "/data/uploads"
    ports:
      - "5080:8080"
    volumes:
      - uploads-data:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5080"
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  pg-data:
  uploads-data:
